name: CI

# Runs on pull requests. Pushes to main run it through publish.yml, which
# calls this workflow and only publishes if it passes.
on:
    pull_request:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

        steps:
            - uses: actions/checkout@v4

            # The Playwright test runner runs on Node.
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Check formatting
              run: bun run format:check

            - name: Typecheck
              run: bun run typecheck

            - name: Unit tests
              run: bun test

            - name: Build
              run: bun run build

            # Cache the browser download, keyed on the exact Playwright version
            # pinned in bun.lock.
            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

            # --with-deps also installs the system libraries, which are not cached.
            - name: Install Playwright browser
              run: bunx playwright install --with-deps chromium

            - name: End-to-end tests
              run: bun run test:e2e

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14
